<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F42C37" />
    <meta name="description" content="منصة الاستجابة المجتمعية لحالات الطوارئ — مساعدة فورية من متطوعين قريبين" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- DNS prefetch للـ APIs والمصادر الخارجية -->
    <link rel="dns-prefetch" href="//76.13.5.194" />
    <link rel="dns-prefetch" href="//nominatim.openstreetmap.org" />
    <link rel="dns-prefetch" href="//tile.openstreetmap.org" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />

    <!-- Preconnect للمصادر الحرجة -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>E-Help — الاستجابة المجتمعية لحالات الطوارئ</title>

    <!-- Open Graph للـ SEO -->
    <meta property="og:title"       content="E-Help — الاستجابة المجتمعية" />
    <meta property="og:description" content="مساعدة فورية من متطوعين قريبين. أبلغ عن حالات الطوارئ وأنقذ الأرواح." />
    <meta property="og:type"        content="website" />
    <meta property="og:image"       content="/emergency.png" />

    <!-- ✅ سكريبت إعادة التوجيه لحل مشكلة زر الرجوع والروابط -->
    <script>
      (function() {
        var base = '/emergency-website/';
        var path = window.location.pathname;
        // إذا كان المسار لا يبدأ بـ base ولا هو '/' أو '/index.html' ولا هو ملف (يحتوي على نقطة)
        if (
          !path.startsWith(base) &&
          path !== '/' &&
          path !== '' &&
          !path.match(/\.[a-zA-Z0-9]+$/)
        ) {
          // إذا كان المسار '/register' مثلاً، نحوله إلى '/emergency-website/register'
          var newPath = base + path.replace(/^\//, '');
          window.location.replace(newPath);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
